# Foundry workspace for the ZKx8004 contracts behind Sherwood.
# Compiler settings match scripts/compile-contracts.ts so Foundry builds the same bytecode the app deploys.

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Cross-language test vectors generated by scripts/generate-vectors.ts.
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
# The registry is deployed on Robinhood Chain mainnet. Reformatting it would change the
# metadata hash and break explorer verification, so it is never touched by forge fmt.
ignore = ["contracts/ZKx8004Registry.sol"]
