[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sherwood-sdk"
version = "0.1.0"
description = "Python SDK for Sherwood: pay x402 resources with USDG and use the ZKx8004 registry on Robinhood Chain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sherwood" }]
keywords = ["x402", "eip-3009", "usdg", "robinhood-chain", "ai-agents", "zero-knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["eth-account>=0.13,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sherwood = "sherwood.cli:main"

[project.urls]
Source = "https://github.com/sympony1992/sherwood"

[tool.hatch.build.targets.wheel]
packages = ["src/sherwood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs against a local anvil node and needs `forge build` artifacts",
    "parity: runs the app's TypeScript verifier through Node.js",
]
